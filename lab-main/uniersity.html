<!DOCTYPE html>
<html>
<head>
    <title>University Finder</title>
    <link rel="stylesheet" href="university.css">
</head>
<body>

    <div class="container">

        <h1>🎓 University Finder</h1>

        <p>Enter a country name to find universities</p>

        <input
            type="text"
            id="country"
            placeholder="Enter country name"
        >

        <button onclick="searchUniversity()">
            Search
        </button>

        <h3 id="message"></h3>

        <div id="result"></div>

    </div>

    <script src="university.js"></script>

</body>
</html>
